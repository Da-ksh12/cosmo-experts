# Production-shaped stack: Caddy (TLS) -> Next.js -> FastAPI, optional Redis, Prometheus + Alertmanager.
# NOT RUN in the development environment (no container runtime). Review docs/DEPLOYMENT.md before use.
# Secrets are Docker secrets (files under ./secrets/, never committed); the application reads NAME_FILE variables.
name: cosmo

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      COSMO_DOMAIN: ${COSMO_DOMAIN:?set COSMO_DOMAIN to the public host name}
      COSMO_ACME_EMAIL: ${COSMO_ACME_EMAIL:?set COSMO_ACME_EMAIL}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks: [cosmo]

  frontend:
    build:
      context: ./frontend
      args: { COSMO_API_URL: "http://backend:8000" }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [backend]
    networks: [cosmo]

  backend:
    build: { context: ./backend, args: { WITH_TORCH: "${WITH_TORCH:-0}" } }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      COSMO_MODE: production
      COSMO_AUTH: supabase
      COSMO_STORAGE: supabase
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      COSMO_CORS: https://${COSMO_DOMAIN}
      COSMO_DB: postgres                                          # production refuses SQLite; the database is Supabase's PostgreSQL (or your own)
      COSMO_MIGRATION_MODE: check                                 # the app only CHECKS; apply migrations with the migrate service below
      COSMO_COOKIE_SECURE: "1"
      COSMO_ADMIN_CLINICAL_ACCESS: ${COSMO_ADMIN_CLINICAL_ACCESS:?choose none or read (docs/PRODUCTION_CONFIGURATION.md)}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set the public anon/publishable key}
      COSMO_SCANNER: ${COSMO_SCANNER:-none}
      COSMO_ALLOW_UNSCANNED_UPLOADS: ${COSMO_ALLOW_UNSCANNED_UPLOADS:-0}   # production refuses to start with no scanner unless this is 1 (docs/PRIVATE_FILE_STORAGE.md)
      COSMO_DATABASE_URL_FILE: /run/secrets/database_url
      COSMO_DB_CONTEXT_SECRET_FILE: /run/secrets/db_context_secret
      COSMO_REDIS_URL_FILE: /run/secrets/redis_url
      COSMO_SECRET_FILE: /run/secrets/cosmo_secret
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      COSMO_BACKUP_KEY_FILE: /run/secrets/backup_key
      COSMO_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
    secrets: [redis_url, cosmo_secret, supabase_service_role_key, backup_key, metrics_token, database_url, db_context_secret]
    volumes:
      - cosmo_data:/data
    depends_on: [redis]
    networks: [cosmo]

  migrate:
    # One-shot: `docker compose run --rm migrate status|apply|verify`. Uses the OWNER credential, which the running backend never sees.
    build: { context: ./backend }
    profiles: [ops]
    entrypoint: ["python", "-m", "scripts.migrate"]
    environment:
      COSMO_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      COSMO_DB_CONTEXT_SECRET_FILE: /run/secrets/db_context_secret
    secrets: [migration_database_url, db_context_secret]
    networks: [cosmo]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [cosmo]

  backup:
    # Daily encrypted backup + pruning, then a health check that also verifies backup freshness. Same image and secrets as the backend.
    build: { context: ./backend }
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["while true; do python -m scripts.pg_backup backup /backups || echo backup failed; sleep 86400; done"]      # restore is verified into an empty database: docs/BACKUP_AND_RECOVERY.md
    environment:
      COSMO_DATA_DIR: /data
      COSMO_STORAGE: supabase
      COSMO_BACKUP_KEY_FILE: /run/secrets/backup_key
      COSMO_BACKUP_DATABASE_URL_FILE: /run/secrets/backup_database_url
    secrets: [backup_key, backup_database_url]
    volumes:
      - cosmo_data:/data
      - backups:/backups
    networks: [cosmo]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    networks: [cosmo]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: [monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./ops/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    secrets: [alert_webhook_url]
    networks: [cosmo]

secrets:
  redis_url: { file: ./secrets/redis_url }                       # e.g. redis://redis:6379/0
  cosmo_secret: { file: ./secrets/cosmo_secret }
  supabase_service_role_key: { file: ./secrets/supabase_service_role_key }
  backup_key: { file: ./secrets/backup_key }                     # python -m scripts.backup genkey
  metrics_token: { file: ./secrets/metrics_token }
  database_url: { file: ./secrets/database_url }                 # application connection: role cosmo_app (no BYPASSRLS), sslmode=require
  migration_database_url: { file: ./secrets/migration_database_url }   # owner role, used only by the migrate service
  backup_database_url: { file: ./secrets/backup_database_url }   # a role that can read every row (owner/BYPASSRLS), used only by the backup service
  db_context_secret: { file: ./secrets/db_context_secret }       # >= 32 random characters
  alert_webhook_url: { file: ./secrets/alert_webhook_url }       # chat webhook for alerts

volumes:
  cosmo_data:
  backups:
  caddy_data:
  caddy_config:
  prometheus_data:

# One private bridge network. Only Caddy publishes ports. The backend needs outbound HTTPS to Supabase, so the network is not 'internal'.
networks:
  cosmo:
