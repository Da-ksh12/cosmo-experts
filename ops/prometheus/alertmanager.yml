# Routes alerts to a chat webhook (Slack-, Mattermost- and Teams-compatible). The URL is a secret: supply it as a file mounted into the container
# (webhook_url_file), never inline in this repository.
route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    - matchers: [severity="info"]
      receiver: team
      repeat_interval: 24h

receivers:
  - name: team
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname="CosmoBackendDown"]
    target_matchers: [severity=~"warning|info"]
    equal: []
